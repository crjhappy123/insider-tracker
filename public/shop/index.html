<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>买菜比价 · Shoreline</title>
<link rel="stylesheet" href="./style.css?v=cb0943ab">
</head>
<body data-mode="static" data-palette="#2a78d6,#eb6834,#1baf7a,#eda100">

<header class="topbar">
  <div class="brand">
    <strong>买菜比价</strong>
    <span class="muted" id="homeLabel"></span>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="today" class="on">今日促销</button>
    <button data-tab="deals">打折专区</button>
    <button data-tab="compare">比价</button>
    <button data-tab="basket">购物清单</button>
    <button data-tab="library">商品库</button>
  </nav>
  <button id="themeToggle" class="ghost" title="切换深浅色">◐</button>
</header>

<main id="main">
  <div class="loading">加载中…</div>
</main>

<!-- 商品详情抽屉：比价明细 + 价格走势 -->
<div id="drawer" class="drawer" hidden>
  <div class="drawer-backdrop" data-close></div>
  <section class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <header>
      <h2 id="drawerTitle"></h2>
      <button class="ghost" data-close aria-label="关闭">✕</button>
    </header>
    <div id="drawerBody"></div>
  </section>
</div>

<template id="tpl-empty">
  <div class="empty">
    <p class="empty-title"></p>
    <p class="muted empty-hint"></p>
  </div>
</template>

<script type="module" src="./app.js?v=3a0c3065"></script>
</body>
</html>
