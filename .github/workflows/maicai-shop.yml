name: 买菜比价 daily ingest → /shop

# 每天抓一次菜价，重新导出 /shop 静态站并发布。
#
# 为什么价格历史要提交回仓库：runner 是一次性的，SQLite 文件留不下来，
# 而「这个促销是不是真便宜」完全依赖 90 天历史中位价。所以流程是
#   灌入仓库里的历史 → 抓今天 → 导出站点 → 把今天的历史提交回来。
# 历史按天一个 JSON 文件，写完就不再改动，git 只存一次。

on:
  schedule:
    # 14:00 UTC = 早上 7 点（太平洋夏令时）。超市的每周促销单一般凌晨就更新了，
    # 早上抓能赶上当天做饭买菜的决定。
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      stores:
        description: "只抓这几家（逗号分隔，如 fred_meyer,boohan）。留空 = 全部"
        required: false
      source:
        description: "real（真实站点）或 sample（离线样本，用来验证流程）"
        required: false
        default: real

concurrency:
  # 别让两次运行同时改历史文件
  group: maicai-shop
  cancel-in-progress: false

jobs:
  ingest-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要把当天的价格历史提交回仓库
    defaults:
      run:
        working-directory: maicai

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite 需要 Node 22+
          node-version: "22"

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Install Chromium (Trader Joe's / 99 Ranch / T&T 需要真实浏览器)
        run: npx playwright install --with-deps chromium

      - name: 灌入已有价格历史
        run: npm run history:load

      - name: 抓取今天的价格
        env:
          # 没配这些 secret 的店会失败并被跳过，其它店照常 —— 不会让整个流程挂掉
          KROGER_CLIENT_ID: ${{ secrets.KROGER_CLIENT_ID }}
          KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}
          KROGER_LOCATION_ID: ${{ secrets.KROGER_LOCATION_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          STORES="${{ github.event.inputs.stores }}"
          SOURCE="${{ github.event.inputs.source || 'real' }}"
          ARGS="--source=$SOURCE"
          [ -n "$STORES" ] && ARGS="$ARGS --stores=$STORES"
          echo "npm run ingest -- $ARGS"
          # 单店失败不该让整个流程挂掉（超市改版是常态），所以这里不 fail
          npm run ingest -- $ARGS || echo "::warning::部分门店抓取失败，用已有数据继续"

      - name: 导出静态站到 public/shop
        run: npm run export -- --out=../public/shop

      - name: 导出价格历史
        run: npm run history:dump

      - name: 提交价格历史
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maicai/data/history
          if git diff --cached --quiet; then
            echo "历史没变化，不提交"
          else
            git commit -m "maicai: 价格历史 $(date -u +%F)"
            git push
          fi

      - name: 发布到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd "$GITHUB_WORKSPACE"
          # 注意：Pages 部署是整目录快照，这一步会把 public/ 和 functions/ 一起发布，
          # 也就是同时发布炒股站。所以 functions/ 必须始终是可发布状态。
          npx --yes wrangler@3 pages deploy public \
            --project-name=insider-tracker \
            --commit-dirty=true
