name: Daily EDGAR ingest → D1

on:
  schedule:
    # 07:00 UTC daily; ingests the previous calendar day's Form 4 filings.
    - cron: "0 7 * * *"
  workflow_dispatch: # allow manual runs
    inputs:
      date:
        description: "Date to ingest (YYYY-MM-DD). Defaults to yesterday."
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Ingest filings into local SQLite
        env:
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        run: |
          DAY="${{ github.event.inputs.date }}"
          [ -z "$DAY" ] && DAY="$(date -u -d 'yesterday' +%F)"
          echo "Ingesting $DAY"
          python -m scraper.ingest "$DAY"

      - name: Export to D1 SQL
        run: python -m scraper.export_d1 > data.sql

      - name: Push to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 d1 execute insider --remote --file=data.sql
