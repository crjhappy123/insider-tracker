name: Daily EDGAR ingest → D1

on:
  schedule:
    # Twice daily (UTC). SEC's daily master index for a trading day is only
    # finalized ~22:00 ET, so we run:
    #   03:00 UTC — after the US close + index finalize (~22:00 ET): captures
    #               the day that just closed, same evening for US users.
    #   13:00 UTC — before the US open (~08:00 ET): refresh + self-heal any
    #               filings that landed late overnight.
    - cron: "0 3 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch: # allow manual runs
    inputs:
      date:
        description: "Date to ingest (YYYY-MM-DD). Defaults to yesterday→today."
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Ingest filings into local SQLite
        env:
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        run: |
          MANUAL="${{ github.event.inputs.date }}"
          if [ -n "$MANUAL" ]; then
            START="$MANUAL"; END="$MANUAL"
          else
            # Ingest yesterday→today so a run always self-heals the prior day
            # and picks up today's filings as soon as its index is available.
            START="$(date -u -d 'yesterday' +%F)"; END="$(date -u +%F)"
          fi
          echo "Ingesting $START..$END"
          python -m scraper.ingest "$START" "$END"
          # Target the freshest day actually present (manual run → that date).
          if [ -n "$MANUAL" ]; then
            DAY="$MANUAL"
          else
            DAY="$(python -c "import sqlite3; print(sqlite3.connect('insider.db').execute('select max(filing_date) from transactions').fetchone()[0] or '')")"
          fi
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          echo "Freshest day in DB: $DAY"

      - name: Push transactions to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python -m scraper.export_d1 > data.sql
          npx --yes wrangler@3 d1 execute insider --remote --file=data.sql

      - name: Generate AI report + scores
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          if [ -z "$DAY" ]; then echo "No data ingested; skipping AI report"; exit 0; fi
          python -m scraper.ai_report "$DAY"

      - name: Push AI report + scores to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # If GEMINI_API_KEY is unset the tables are empty; skip the empty files.
          python -m scraper.export_d1 --table daily_reports > reports.sql
          python -m scraper.export_d1 --table ai_scores > scores.sql
          [ -s reports.sql ] && npx --yes wrangler@3 d1 execute insider --remote --file=reports.sql || echo "no report to push"
          [ -s scores.sql ] && npx --yes wrangler@3 d1 execute insider --remote --file=scores.sql || echo "no scores to push"

      # Keep only the rolling retention window (default 7 days) in D1.
      - name: Prune old data from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS }}
        run: |
          python -m scraper.prune --print-sql > prune.sql
          cat prune.sql
          npx --yes wrangler@3 d1 execute insider --remote --file=prune.sql
