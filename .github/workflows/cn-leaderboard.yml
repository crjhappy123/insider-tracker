name: A-share AI leaderboard refresh → D1

on:
  schedule:
    # Shortly after each A-share ingest (09:30 / 01:00 UTC), so the boards pick up
    # the freshest AI scores and refresh every tracked 股票代码's current price.
    - cron: "0 10 * * *"
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  leaderboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install -r requirements.txt

      # Ensure the durable cn_leaderboard table exists remotely (idempotent).
      - name: Ensure D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 d1 execute insider --remote --file=schema.sql

      # Reconstruct a local DB from D1 (current cn_transactions + cn_ai_scores + the
      # existing cn_leaderboard rows) so maintenance preserves first-added dates.
      - name: Pull current data from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 d1 export insider --remote --no-schema --output=dump.sql
          python -m scraper.load_dump schema.sql dump.sql

      # Upsert current picks (stamping entry price for new ones) and refresh
      # current price for every tracked code via the free 东方财富 kline API.
      - name: Maintain A-share leaderboard
        run: python -m scraper.cn_leaderboard

      - name: Export & push A-share leaderboard to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python -m scraper.export_d1 --table cn_leaderboard > cn_leaderboard.sql
          [ -s cn_leaderboard.sql ] && npx --yes wrangler@3 d1 execute insider --remote --file=cn_leaderboard.sql || echo "no leaderboard rows to push"
